openapi: 3.1.0
info:
  title: API de banco de alimentos
  version: 1.0.0
  description: Contrato de consulta de inventario, autenticación y entrega por remito.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Autenticacion
    description: Inicio de sesión y emisión del token de acceso.
  - name: Remitos
    description: Preparación, consulta y confirmación de entregas.
  - name: Detalles de remito
    description: Selección de existencias y cantidades para un borrador.
  - name: Productos
    description: Consulta y administración del catálogo de productos.
  - name: Stock
    description: Consulta de existencias separadas por vencimiento.
  - name: Donantes
    description: Consulta y administración de donantes.
  - name: Donaciones
    description: Registro y consulta de recepciones confirmadas.
  - name: Items de donación
    description: Detalle inmutable de las recepciones.
  - name: Instituciones
    description: Consulta de instituciones y su estado de pago.
  - name: Facturas
    description: Consulta de facturas, sin operaciones de modificación.
  - name: Notificaciones
    description: Avisos de vencimiento visibles para depósito.
  - name: Usuarios
    description: Identidad autenticada y provisionamiento protegido de cuentas.
paths:
  /auth/login:
    post:
      tags: [Autenticacion]
      operationId: iniciarSesion
      summary: Iniciar sesión y obtener un token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginSolicitud"
      responses:
        "200":
          description: Autenticación correcta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRespuesta"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
  /auth/yo:
    get:
      tags: [Autenticacion]
      operationId: consultarIdentidad
      summary: Consultar la identidad autenticada
      x-roles: [user_deposito, user_institucional, user_tesoreria]
      responses:
        "200":
          description: Identidad del usuario autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
  /usuarios:
    post:
      tags: [Usuarios]
      operationId: provisionarUsuario
      summary: Provisionar una cuenta de usuario
      description: Operación protegida disponible únicamente para user_deposito.
      x-roles: [user_deposito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AltaUsuarioSolicitud"
      responses:
        "201":
          description: Usuario creado sin exponer su hash de clave
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /remitos:
    get:
      tags: [Remitos]
      operationId: listarRemitos
      summary: Listar remitos visibles para el usuario
      description: Solo depósito puede consultar y filtrar remitos.
      x-roles: [user_deposito]
      parameters:
        - $ref: "#/components/parameters/InstitucionId"
        - name: fechaDesde
          in: query
          schema: { type: string, format: date }
        - name: fechaHasta
          in: query
          schema: { type: string, format: date }
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoRemito" }
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Página de remitos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaRemitos"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    post:
      tags: [Remitos]
      operationId: crearBorradorRemito
      summary: Crear un borrador de remito
      description: Requiere el rol user_deposito. Una institución en deuda es válida.
      x-roles: [user_deposito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearRemito"
      responses:
        "201":
          description: Borrador creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remito"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /remitos/{remitoId}/detalles:
    post:
      tags: [Detalles de remito]
      operationId: agregarDetalleRemito
      summary: Agregar un detalle al borrador
      description: El depósito elige explícitamente la existencia y vencimiento.
      x-roles: [user_deposito]
      parameters:
        - $ref: "#/components/parameters/RemitoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgregarDetalle"
      responses:
        "201":
          description: Detalle agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetalleRemito"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /remitos/{remitoId}/confirmacion:
    post:
      tags: [Remitos]
      operationId: confirmarRemito
      summary: Confirmar un remito y descontar todo su stock
      description: Revalida todas las líneas y confirma o rechaza el conjunto de forma atómica.
      x-roles: [user_deposito]
      parameters:
        - $ref: "#/components/parameters/RemitoId"
      responses:
        "200":
          description: Remito confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Remito"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /donantes:
    get:
      tags: [Donantes]
      operationId: listarDonantes
      summary: Listar y filtrar donantes
      x-roles: [user_deposito]
      parameters:
        - $ref: "#/components/parameters/Nombre"
        - $ref: "#/components/parameters/Activo"
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Donantes que coinciden con los filtros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaDonantes"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    post:
      tags: [Donantes]
      operationId: crearDonante
      summary: Registrar un donante
      x-roles: [user_deposito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonanteSolicitud"
      responses:
        "201":
          description: Donante registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donante"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
  /donantes/{donanteId}:
    parameters:
      - $ref: "#/components/parameters/DonanteId"
    get:
      tags: [Donantes]
      operationId: consultarDonante
      summary: Consultar un donante
      x-roles: [user_deposito]
      responses:
        "200":
          description: Donante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donante"
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    put:
      tags: [Donantes]
      operationId: actualizarDonante
      summary: Actualizar un donante
      x-roles: [user_deposito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonanteSolicitud"
      responses:
        "200":
          description: Donante actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Donante"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    delete:
      tags: [Donantes]
      operationId: darDeBajaDonante
      summary: Desactivar un donante sin borrar su historial
      x-roles: [user_deposito]
      responses:
        "204":
          description: Donante desactivado
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
  /donaciones:
    get:
      tags: [Donaciones]
      operationId: listarDonaciones
      summary: Listar y filtrar donaciones confirmadas
      x-roles: [user_deposito]
      parameters:
        - name: donanteId
          in: query
          schema: { type: integer, format: int64 }
        - name: fechaDesde
          in: query
          schema: { type: string, format: date }
        - name: fechaHasta
          in: query
          schema: { type: string, format: date }
        - name: productoId
          in: query
          schema: { type: integer, format: int64 }
        - name: vencimientoDesde
          in: query
          schema: { type: string, format: date }
        - name: vencimientoHasta
          in: query
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Donaciones que coinciden con los filtros
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaDonaciones"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    post:
      tags: [Donaciones]
      operationId: confirmarDonacion
      summary: Registrar una recepción, aumentar stock y emitir un comprobante
      description: Las tres operaciones son atómicas. Un error revierte donación, stock y comprobante.
      x-roles: [user_deposito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonacionSolicitud"
      responses:
        "201":
          description: Recepción confirmada con comprobante asociado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonacionConfirmada"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /donaciones/{donacionId}:
    parameters:
      - name: donacionId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Donaciones]
      operationId: consultarDonacion
      summary: Consultar una recepción confirmada y su comprobante
      x-roles: [user_deposito]
      responses:
        "200":
          description: Donación y comprobante asociado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonacionConfirmada"
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
  /donaciones/{donacionId}/items:
    get:
      tags: [Items de donación]
      operationId: listarItemsDonacion
      summary: Consultar las líneas inmutables de una recepción
      x-roles: [user_deposito]
      parameters:
        - name: donacionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Detalle de productos, cantidades, unidades y vencimientos recibidos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ItemDonacion" }
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
  /productos:
    get:
      tags: [Productos]
      operationId: listarProductosDonacion
      summary: Filtrar productos
      x-roles: [user_deposito]
      parameters:
        - name: nombre
          in: query
          schema: { type: string }
        - name: tipoAlimento
          in: query
          schema: { type: string }
        - name: unidadMedida
          in: query
          schema: { type: string }
        - name: activo
          in: query
          schema: { type: boolean }
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaProductos"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    post:
      tags: [Productos]
      operationId: crearProducto
      summary: Agregar un producto al catálogo
      x-roles: [user_deposito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoSolicitud"
      responses:
        "201":
          description: Producto agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
  /productos/{productoId}:
    parameters:
      - name: productoId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      tags: [Productos]
      operationId: actualizarProducto
      summary: Actualizar un producto sin alterar snapshots históricos
      x-roles: [user_deposito]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductoSolicitud"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producto"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    delete:
      tags: [Productos]
      operationId: desactivarProducto
      summary: Desactivar un producto sin borrar existencias ni historial
      x-roles: [user_deposito]
      responses:
        "204":
          description: Producto desactivado
        "404":
          $ref: "#/components/responses/ErrorNoEncontrado"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
  /stock:
    get:
      tags: [Stock]
      operationId: listarStockDonacion
      summary: Filtrar existencias por producto, vencimiento y estado
      x-roles: [user_deposito]
      parameters:
        - name: productoId
          in: query
          schema: { type: integer, format: int64 }
        - name: fechaVencimiento
          in: query
          schema: { type: string, format: date }
        - name: estado
          in: query
          schema: { $ref: "#/components/schemas/EstadoStock" }
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Página de existencias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaStock"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
  /instituciones:
    get:
      tags: [Instituciones]
      operationId: listarInstituciones
      summary: Filtrar instituciones
      description: Permitido a user_institucional, user_deposito y user_tesoreria.
      x-roles: [user_institucional, user_deposito, user_tesoreria]
      parameters:
        - name: nombre
          in: query
          description: Coincidencia parcial sin distinguir mayúsculas/minúsculas.
          schema: { type: string }
        - name: tipo
          in: query
          description: Coincidencia exacta luego de quitar espacios exteriores.
          schema: { type: string }
        - name: estadoPago
          in: query
          schema: { $ref: "#/components/schemas/EstadoPago" }
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Página de instituciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaInstituciones"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
    post:
      tags: [Instituciones]
      operationId: crearInstitucion
      summary: Registrar una institución
      x-roles: [user_institucional]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitucionSolicitud"
      responses:
        "201":
          description: Institución creada con estado inicial AL_DIA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institucion"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /instituciones/{institucionId}:
    parameters:
      - name: institucionId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      tags: [Instituciones]
      operationId: consultarInstitucion
      summary: Consultar una institución activa
      x-roles: [user_institucional, user_deposito, user_tesoreria]
      responses:
        "200":
          description: Institución consultada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institucion"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
    put:
      tags: [Instituciones]
      operationId: actualizarInstitucion
      summary: Actualizar datos de una institución
      x-roles: [user_institucional]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitucionSolicitud"
      responses:
        "200":
          description: Institución actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institucion"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
    delete:
      tags: [Instituciones]
      operationId: darDeBajaInstitucion
      summary: Dar de baja lógicamente una institución
      x-roles: [user_institucional]
      responses:
        "204":
          description: Institución desactivada sin borrar sus remitos históricos.
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /instituciones/{institucionId}/estado-pago:
    parameters:
      - name: institucionId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    patch:
      tags: [Instituciones]
      operationId: actualizarEstadoPagoInstitucion
      summary: Actualizar el estado de pago vigente
      x-roles: [user_tesoreria]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstadoPagoSolicitud"
      responses:
        "200":
          description: Estado de pago actualizado o confirmado sin cambios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Institucion"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "422":
          $ref: "#/components/responses/ErrorReglaNegocio"
  /facturas:
    get:
      tags: [Facturas]
      operationId: listarFacturasRecepcion
      summary: Consultar facturas legadas y comprobantes de recepción en modo de solo lectura
      description: Los comprobantes de donación no son fiscales ni cobrables.
      x-roles: [user_deposito]
      parameters:
        - $ref: "#/components/parameters/InstitucionId"
        - name: donanteId
          in: query
          schema: { type: integer, format: int64 }
        - name: productoId
          in: query
          schema: { type: integer, format: int64 }
        - name: fechaDesde
          in: query
          schema: { type: string, format: date }
        - name: fechaHasta
          in: query
          schema: { type: string, format: date }
        - name: fechaVencimiento
          in: query
          schema: { type: string, format: date }
        - name: estado
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Página de facturas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaFacturas"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
        "405":
          $ref: "#/components/responses/ErrorMetodoNoPermitido"
  /notificaciones:
    get:
      tags: [Notificaciones]
      operationId: listarNotificaciones
      summary: Consultar avisos almacenados para depósito
      x-roles: [user_deposito]
      parameters:
        - name: tipo
          in: query
          schema: { $ref: "#/components/schemas/TipoNotificacion" }
        - $ref: "#/components/parameters/Pagina"
        - $ref: "#/components/parameters/Tamano"
      responses:
        "200":
          description: Página de avisos de depósito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaNotificaciones"
        "400":
          $ref: "#/components/responses/ErrorSolicitud"
        "401":
          $ref: "#/components/responses/ErrorNoAutenticado"
        "403":
          $ref: "#/components/responses/ErrorProhibido"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RemitoId:
      name: remitoId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    InstitucionId:
      name: institucionId
      in: query
      schema: { type: integer, format: int64 }
    DonanteId:
      name: donanteId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Nombre:
      name: nombre
      in: query
      schema: { type: string }
    Activo:
      name: activo
      in: query
      schema: { type: boolean }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Tamano:
      name: tamano
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    ErrorSolicitud:
      description: Solicitud inválida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ErrorNoAutenticado:
      description: Falta autenticación o el token no es válido
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ErrorProhibido:
      description: El rol no está autorizado para esta operación
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ErrorNoEncontrado:
      description: El recurso no existe o no es visible para el usuario
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ErrorMetodoNoPermitido:
      description: El método HTTP no está implementado para el recurso
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ErrorReglaNegocio:
      description: Regla de negocio incumplida
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    LoginSolicitud:
      type: object
      required: [nombreUsuario, clave]
      properties:
        nombreUsuario: { type: string }
        clave: { type: string, format: password }
    AltaUsuarioSolicitud:
      type: object
      required: [nombreUsuario, clave, rol]
      properties:
        nombreUsuario: { type: string, maxLength: 100 }
        clave: { type: string, format: password, minLength: 12, maxLength: 128 }
        rol: { $ref: "#/components/schemas/Rol" }
        institucionId:
          type: [integer, "null"]
          format: int64
          description: Obligatorio únicamente para user_institucional.
    UsuarioRespuesta:
      type: object
      required: [id, nombreUsuario, rol, activo]
      properties:
        id: { type: integer, format: int64 }
        nombreUsuario: { type: string }
        rol: { $ref: "#/components/schemas/Rol" }
        institucionId: { type: [integer, "null"], format: int64 }
        activo: { type: boolean }
    TokenRespuesta:
      type: object
      required: [token, tipo, expiraEnSegundos, roles]
      properties:
        token: { type: string }
        tipo: { type: string, const: Bearer }
        expiraEnSegundos: { type: integer }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Rol" }
    Rol:
      type: string
      enum: [user_deposito, user_institucional, user_tesoreria]
    CrearRemito:
      type: object
      required: [institucionId, fechaEntrega]
      properties:
        institucionId: { type: integer, format: int64 }
        fechaEntrega: { type: string, format: date }
    AgregarDetalle:
      type: object
      required: [stockId, cantidad]
      properties:
        stockId: { type: integer, format: int64, description: Existencia elegida manualmente }
        cantidad: { type: number, exclusiveMinimum: 0 }
    EstadoRemito:
      type: string
      enum: [BORRADOR, CONFIRMADO]
    EstadoStock:
      type: string
      enum: [DISPONIBLE, VENCIDO, SIN_VENCIMIENTO]
    EstadoPago:
      type: string
      enum: [AL_DIA, EN_DEUDA, PARTICULAR]
    EstadoPagoSolicitud:
      type: object
      additionalProperties: false
      required: [estadoPago]
      properties:
        estadoPago:
          $ref: "#/components/schemas/EstadoPago"
    TipoNotificacion:
      type: string
      enum: [POR_VENCER, VENCIDO]
    Remito:
      type: object
      required: [id, institucionId, institucionNombre, institucionDomicilio, fechaEntrega, estado, detalles]
      properties:
        id: { type: integer, format: int64 }
        institucionId: { type: integer, format: int64 }
        institucionNombre: { type: string }
        institucionDomicilio: { type: string }
        fechaEntrega: { type: string, format: date }
        estado: { $ref: "#/components/schemas/EstadoRemito" }
        detalles:
          type: array
          items: { $ref: "#/components/schemas/DetalleRemito" }
    DetalleRemito:
      type: object
      required: [id, productoId, productoNombre, stockId, fechaVencimiento, cantidad]
      properties:
        id: { type: integer, format: int64 }
        productoId: { type: integer, format: int64 }
        productoNombre: { type: string }
        stockId: { type: integer, format: int64 }
        fechaVencimiento: { type: string, format: date }
        cantidad: { type: number }
    Producto:
      type: object
      required: [id, nombre, tipoAlimento, unidadMedida, activo]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        descripcion: { type: string }
        tipoAlimento:
          type: [string, "null"]
          description: Nulo únicamente para productos legados aún no clasificados.
        unidadMedida: { type: string }
        activo: { type: boolean }
    Existencia:
      type: object
      required: [id, productoId, productoNombre, cantidadDisponible, estado]
      properties:
        id: { type: integer, format: int64 }
        productoId: { type: integer, format: int64 }
        productoNombre: { type: string }
        fechaVencimiento: { type: [string, "null"], format: date }
        cantidadDisponible: { type: number, minimum: 0 }
        estado: { $ref: "#/components/schemas/EstadoStock" }
    InstitucionSolicitud:
      type: object
      additionalProperties: false
      required: [nombre, domicilio, tipo]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 150 }
        domicilio: { type: string, minLength: 1, maxLength: 250 }
        tipo: { type: string, minLength: 1, maxLength: 80 }
    Institucion:
      type: object
      required: [id, nombre, domicilio, tipo, estadoPago, activa]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string }
        domicilio: { type: string }
        tipo: { type: [string, "null"], maxLength: 80 }
        estadoPago: { $ref: "#/components/schemas/EstadoPago" }
        activa: { type: boolean }
    FacturaConsulta:
      type: object
      description: Facturas legadas y comprobantes inmutables de donación.
      required: [id, numero, fecha, estado, importe, detalles]
      properties:
        id: { type: integer, format: int64 }
        numero: { type: string }
        institucionId: { type: [integer, "null"], format: int64 }
        donanteId: { type: [integer, "null"], format: int64 }
        donacionId: { type: [integer, "null"], format: int64 }
        fecha: { type: string, format: date }
        estado:
          type: string
          description: Los comprobantes nuevos usan estado EMITIDA; se conservan estados históricos.
        importe:
          type: [number, "null"]
          description: Nulo para comprobantes de donación; no representa un importe económico.
        detalles:
          type: array
          items: { $ref: "#/components/schemas/ItemDonacion" }
    DonanteSolicitud:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 150 }
        correo: { type: [string, "null"], format: email, maxLength: 254 }
        telefono: { type: [string, "null"], maxLength: 50 }
    Donante:
      allOf:
        - $ref: "#/components/schemas/DonanteSolicitud"
        - type: object
          required: [id, activo]
          properties:
            id: { type: integer, format: int64 }
            activo: { type: boolean }
    DonacionSolicitud:
      type: object
      required: [donanteId, fecha, items]
      properties:
        donanteId: { type: integer, format: int64 }
        fecha: { type: string, format: date }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [cantidad, fechaVencimiento]
            properties:
              productoId: { type: integer, format: int64 }
              nombreProducto: { type: string, minLength: 1, maxLength: 120 }
              tipoAlimento: { type: string, minLength: 1, maxLength: 80 }
              unidadMedida: { type: string, minLength: 1, maxLength: 50 }
              cantidad: { type: number, exclusiveMinimum: 0 }
              fechaVencimiento: { type: string, format: date }
    ItemDonacion:
      type: object
      required: [id, productoId, nombreProducto, tipoAlimento, unidadMedida, cantidad, fechaVencimiento]
      properties:
        id: { type: integer, format: int64 }
        productoId: { type: integer, format: int64 }
        nombreProducto: { type: string }
        tipoAlimento: { type: string }
        unidadMedida: { type: string }
        cantidad: { type: number }
        fechaVencimiento: { type: string, format: date }
    ComprobanteRecepcion:
      type: object
      required: [id, numero, donacionId, donanteId, fecha, detalles]
      properties:
        id: { type: integer, format: int64 }
        numero:
          type: string
          description: Coincide con el ID autoincremental de Factura.
        donacionId: { type: integer, format: int64 }
        donanteId: { type: integer, format: int64 }
        fecha: { type: string, format: date }
        detalles:
          type: array
          items: { $ref: "#/components/schemas/ItemDonacion" }
    Donacion:
      type: object
      required: [id, donanteId, donanteNombre, fecha, items]
      properties:
        id: { type: integer, format: int64 }
        donanteId: { type: integer, format: int64 }
        donanteNombre: { type: string }
        fecha: { type: string, format: date }
        items:
          type: array
          items: { $ref: "#/components/schemas/ItemDonacion" }
    DonacionConfirmada:
      allOf:
        - $ref: "#/components/schemas/Donacion"
        - type: object
          required: [comprobante]
          properties:
            comprobante:
              $ref: "#/components/schemas/ComprobanteRecepcion"
    ProductoSolicitud:
      type: object
      required: [nombre, tipoAlimento, unidadMedida]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 120 }
        descripcion: { type: [string, "null"], maxLength: 1000 }
        tipoAlimento: { type: string, minLength: 1, maxLength: 80 }
        unidadMedida: { type: string, minLength: 1, maxLength: 50 }
    Notificacion:
      type: object
      required: [id, tipo, fechaCreacion, mensaje]
      properties:
        id: { type: integer, format: int64 }
        tipo: { $ref: "#/components/schemas/TipoNotificacion" }
        fechaCreacion: { type: string, format: date-time }
        mensaje: { type: string }
    PaginaRemitos:
      allOf:
        - $ref: "#/components/schemas/PaginaBase"
        - type: object
          properties:
            contenido: { type: array, items: { $ref: "#/components/schemas/Remito" } }
    PaginaProductos:
      allOf:
        - $ref: "#/components/schemas/PaginaBase"
        - type: object
          properties:
            contenido: { type: array, items: { $ref: "#/components/schemas/Producto" } }
    PaginaStock:
      allOf:
        - $ref: "#/components/schemas/PaginaBase"
        - type: object
          properties:
            contenido: { type: array, items: { $ref: "#/components/schemas/Existencia" } }
    PaginaInstituciones:
      allOf:
        - $ref: "#/components/schemas/PaginaBase"
        - type: object
          properties:
            contenido: { type: array, items: { $ref: "#/components/schemas/Institucion" } }
    PaginaFacturas:
      allOf:
        - $ref: "#/components/schemas/PaginaBase"
        - type: object
          properties:
            contenido: { type: array, items: { $ref: "#/components/schemas/FacturaConsulta" } }
    PaginaDonantes:
      allOf:
        - $ref: "#/components/schemas/PaginaBase"
        - type: object
          properties:
            contenido: { type: array, items: { $ref: "#/components/schemas/Donante" } }
    PaginaDonaciones:
      allOf:
        - $ref: "#/components/schemas/PaginaBase"
        - type: object
          properties:
            contenido: { type: array, items: { $ref: "#/components/schemas/Donacion" } }
    PaginaNotificaciones:
      type: object
      required: [content, number, size, totalElements, totalPages]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Notificacion" } }
        number: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    PaginaBase:
      type: object
      required: [pagina, tamano, totalElementos, totalPaginas]
      properties:
        pagina: { type: integer }
        tamano: { type: integer }
        totalElementos: { type: integer, format: int64 }
        totalPaginas: { type: integer }
    Error:
      type: object
      required: [fechaHora, estado, codigo, mensaje, ruta, erroresCampo]
      properties:
        fechaHora: { type: string, format: date-time }
        estado: { type: integer }
        codigo: { type: string }
        mensaje: { type: string }
        ruta: { type: string }
        erroresCampo:
          type: array
          items:
            type: object
            required: [campo, mensaje]
            properties:
              campo: { type: string }
              mensaje: { type: string }
