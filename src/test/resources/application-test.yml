spring:
  datasource:
    url: jdbc:h2:mem:banco-alimentos;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  sql:
    init:
      mode: always

seguridad:
  jwt:
    secreto: clave-de-prueba-solo-para-perfil-test-no-produccion
    duracion: 1h
