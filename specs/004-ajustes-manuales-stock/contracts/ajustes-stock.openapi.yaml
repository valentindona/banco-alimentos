openapi: 3.1.0
info:
  title: Contrato de ajustes manuales de stock
  version: 1.0.0
  description: Fragmento de diseño para incorporar a src/main/resources/openapi.yaml.
paths:
  /api/ajustes:
    post:
      operationId: registrarAjusteStock
      summary: Registrar una corrección o baja de un lote
      description: >
        El usuario y la fecha se obtienen de la identidad autenticada y del servidor.
        La cantidad representa el valor objetivo para CORRECCION y la cantidad a descontar
        para BAJA. Solo user_deposito puede invocar esta operación.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteSolicitud'
            examples:
              baja:
                value:
                  stockId: 25
                  tipo: BAJA
                  cantidad: 2.500
                  motivo: Mercadería dañada
              correccion:
                value:
                  stockId: 25
                  tipo: CORRECCION
                  cantidad: 7.000
                  motivo: Conteo físico del depósito
      responses:
        '201':
          description: Ajuste registrado; devuelve el snapshot inmutable persistido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AjusteRespuesta'
        '400':
          description: Solicitud inválida, incluyendo campos obligatorios o tipo/formato incorrecto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Se requiere autenticación válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: El usuario autenticado no tiene rol user_deposito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '422':
          description: Lote inexistente o regla de negocio incumplida, por ejemplo saldo insuficiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
    get:
      operationId: listarAjustesStock
      summary: Consultar el historial de ajustes
      description: >
        Todos los filtros informados se combinan con AND. fechaDesde y fechaHasta
        son inclusivas y se interpretan sobre la fecha UTC de fechaHora.
        Solo user_deposito puede invocar esta operación.
      security:
        - bearerAuth: []
      parameters:
        - name: productoId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: fechaVencimiento
          in: query
          required: false
          description: Fecha exacta del lote; se omite para no filtrar por vencimiento.
          schema:
            type: string
            format: date
        - name: fechaDesde
          in: query
          required: false
          description: Fecha UTC inclusiva desde la que se filtran los ajustes.
          schema:
            type: string
            format: date
        - name: fechaHasta
          in: query
          required: false
          description: Fecha UTC inclusiva hasta la que se filtran los ajustes.
          schema:
            type: string
            format: date
        - name: usuarioId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoAjuste'
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página de ajustes, ordenada por fechaHora e id descendentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaAjusteRespuesta'
        '400':
          description: Parámetros inválidos o rango de fechas invertido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '401':
          description: Se requiere autenticación válida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '403':
          description: El usuario autenticado no tiene rol user_deposito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TipoAjuste:
      type: string
      enum:
        - CORRECCION
        - BAJA
    AjusteSolicitud:
      type: object
      additionalProperties: false
      required:
        - stockId
        - tipo
        - cantidad
        - motivo
      properties:
        stockId:
          type: integer
          format: int64
          minimum: 1
          description: Identificador de un lote existente devuelto por la consulta de stock.
        tipo:
          $ref: '#/components/schemas/TipoAjuste'
        cantidad:
          type: number
          minimum: 0
          multipleOf: 0.001
          description: >
            Cantidad objetivo para CORRECCION (cero permitido) o cantidad positiva
            a descontar para BAJA; nunca debe superar el stock vigente.
        motivo:
          type: string
          minLength: 1
          description: Texto obligatorio no vacío después de quitar espacios laterales.
    AjusteRespuesta:
      type: object
      required:
        - id
        - stockId
        - productoId
        - usuarioId
        - fechaHora
        - tipo
        - cantidadAnterior
        - cantidadNueva
        - motivo
      properties:
        id:
          type: integer
          format: int64
        stockId:
          type: integer
          format: int64
        productoId:
          type: integer
          format: int64
        fechaVencimiento:
          type:
            - string
            - 'null'
          format: date
        usuarioId:
          type: integer
          format: int64
        fechaHora:
          type: string
          format: date-time
        tipo:
          $ref: '#/components/schemas/TipoAjuste'
        cantidadAnterior:
          type: number
          minimum: 0
          multipleOf: 0.001
        cantidadNueva:
          type: number
          minimum: 0
          multipleOf: 0.001
        motivo:
          type: string
    PaginaAjusteRespuesta:
      type: object
      required:
        - contenido
        - pagina
        - tamano
        - totalElementos
        - totalPaginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/AjusteRespuesta'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    ErrorRespuesta:
      type: object
      description: Formato de error estándar de GlobalExceptionHandler.
      properties:
        fechaHora:
          type: string
          format: date-time
        estado:
          type: integer
        codigo:
          type: string
        mensaje:
          type: string
        ruta:
          type: string
        erroresCampo:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
